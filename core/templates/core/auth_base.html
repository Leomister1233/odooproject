{% load static ui_extras %}
{% portal_lang as current_portal_lang %}
<!doctype html>
<html lang="{{ current_portal_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Accounting Portal{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=20261018-3">
  {% block page_css %}{% endblock %}
</head>
<body class="{% block body_class %}auth-page{% endblock %}">
  {% include "core/partials/flash_messages.html" %}
  <main id="main-content">{% block content %}{% endblock %}</main>
  <script src="{% static 'js/app.js' %}?v=20261018-1"></script>
  {% block page_js %}{% endblock %}
</body>
</html>
