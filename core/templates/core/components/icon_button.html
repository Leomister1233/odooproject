{% load ui_extras %}
{% if href %}
<a href="{{ href }}" class="icon-button{% if extra_classes %} {{ extra_classes }}{% endif %}" aria-label="{{ aria_label|portal_t:request }}" title="{{ aria_label|portal_t:request }}">
{% else %}
<button type="{{ type|default:'button' }}" class="icon-button{% if extra_classes %} {{ extra_classes }}{% endif %}" aria-label="{{ aria_label|portal_t:request }}" title="{{ aria_label|portal_t:request }}">
{% endif %}
  {% if icon_name == "menu" %}
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5m-16.5 5.25h16.5m-16.5 5.25h16.5"/></svg>
  {% elif icon_name == "reports" %}
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 3v18m4.5-12v12m4.5-8v8m4.5-14v14M3 21h18"/></svg>
  {% elif icon_name == "messages" %}
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5A2.25 2.25 0 0119.5 19.5h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15A2.25 2.25 0 002.25 6.75m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0l-7.5-4.615A2.25 2.25 0 012.25 6.993V6.75"/></svg>
  {% elif icon_name == "notifications" %}
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75V9a6 6 0 10-12 0v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.08 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/></svg>
  {% endif %}
{% if href %}
</a>
{% else %}
</button>
{% endif %}
